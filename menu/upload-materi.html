<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Berbagi Materi &amp; Galeri Google Drive Real-Time</title>

  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('theme_preference');
        if (savedTheme === 'light' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    /* ================= TEMA DEFAULT (DARK MODE) ================= */
    :root {
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --primary-light: #312e81;
      --accent: #38bdf8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --success: #4ade80;
      --success-bg: #064e3b;
      --danger: #f87171;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --toggle-btn-bg: #1e293b;
      --toggle-btn-border: #475569;
      --toggle-btn-text: #f8fafc;
      --tab-bar-bg: #1e293b;
      --tab-btn-text: #94a3b8;
      --input-bg: #0f172a;
      --dropzone-bg: #0f172a;
      --dropzone-hover-bg: #1e1b4b;
      --thumb-bg: #0f172a;
      --modal-bg: #1e293b;
      --modal-header-bg: #0f172a;
      --footer-bg: #1e293b;
      --footer-border: #334155;
      --log-item-bg: #0f172a;
      --preview-box-bg: #1e1b4b;
      --preview-box-border: #4338ca;
    }

    /* ================= TEMA TERANG (LIGHT MODE) ================= */
    html.light-theme, body.light-theme {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #e0e7ff;
      --accent: #06b6d4;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #ef4444;
      --shadow-color: rgba(100, 116, 139, 0.12);
      --toggle-btn-bg: #ffffff;
      --toggle-btn-border: #cbd5e1;
      --toggle-btn-text: #0f172a;
      --tab-bar-bg: #e2e8f0;
      --tab-btn-text: #64748b;
      --input-bg: #f8fafc;
      --dropzone-bg: #f8fafc;
      --dropzone-hover-bg: #eef2ff;
      --thumb-bg: #e2e8f0;
      --modal-bg: #ffffff;
      --modal-header-bg: #f8fafc;
      --footer-bg: #ffffff;
      --footer-border: #e2e8f0;
      --log-item-bg: #f8fafc;
      --preview-box-bg: #eef2ff;
      --preview-box-border: #c7d2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px 8px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    /* Top Navigation Controls */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .btn-back-hub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--toggle-btn-bg);
      border: 1.5px solid var(--toggle-btn-border);
      color: var(--text);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 8px 14px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 2px 8px var(--shadow-color);
      transition: transform 0.2s ease;
    }

    .btn-back-hub:hover {
      transform: translateX(-3px);
    }

    .theme-toggle-btn {
      background: var(--toggle-btn-bg);
      border: 1.5px solid var(--toggle-btn-border);
      color: var(--toggle-btn-text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--shadow-color);
      font-size: 1.2rem;
      user-select: none;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
    }

    /* Header */
    .portal-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #065f46 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 18px 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px -4px rgba(49, 46, 129, 0.2);
      text-align: center;
    }

    .badge-top {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #e0e7ff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .portal-header h1 {
      font-size: clamp(1.2rem, 4.5vw, 1.8rem);
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.25;
      color: #ffffff;
    }

    .portal-header p {
      color: #cbd5e1;
      font-size: 0.82rem;
      margin: 0 auto 12px;
      line-height: 1.45;
    }

    .drive-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #10b981;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .drive-link-btn:hover {
      background: #059669;
    }

    /* Tab Bar Navigasi */
    .tab-bar {
      display: flex;
      background: var(--tab-bar-bg);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 16px;
      border: 1.5px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      border-radius: 9px;
      border: none;
      background: transparent;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--tab-btn-text);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 2px 5px var(--shadow-color);
    }

    /* Form Upload Responsif */
    .upload-section {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    .section-desc {
      font-size: 0.78rem;
      color: var(--subtext);
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      background: var(--dropzone-bg);
      transition: all 0.2s;
    }

    .dropzone:hover {
      border-color: var(--primary);
      background: var(--dropzone-hover-bg);
    }

    .dropzone-icon {
      font-size: 2rem;
      margin-bottom: 4px;
    }

    .dropzone p {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
    }

    .dropzone span {
      font-size: 0.72rem;
      color: var(--success);
      font-weight: 700;
      display: inline-block;
      margin-top: 2px;
    }

    .file-preview {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--preview-box-bg);
      border: 1px solid var(--preview-box-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
    }

    .progress-wrapper {
      display: none;
      margin-top: 10px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-status {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
      text-align: right;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-dark);
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: var(--primary);
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Filter Chips Bar */
    .gallery-filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .gallery-filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--subtext);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-refresh {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--primary);
      background: var(--preview-box-bg);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-refresh:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Galeri Grid Mobile */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 650px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
    }

    .doc-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px var(--shadow-color);
      transition: transform 0.2s;
    }

    .doc-thumb {
      height: 110px;
      background: var(--thumb-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .doc-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .doc-card:hover .doc-thumb img {
      transform: scale(1.05);
    }

    .doc-type-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
    }

    .preview-hint {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(2px);
    }

    .doc-body {
      padding: 10px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .doc-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 3px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .doc-desc {
      font-size: 0.72rem;
      color: var(--subtext);
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .doc-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--subtext);
      border-top: 1px dashed var(--border);
      padding-top: 4px;
    }

    .btn-card-group {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }

    .btn-preview-action {
      flex: 1;
      padding: 6px 4px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-align: center;
      background: var(--preview-box-bg);
      color: var(--primary);
      border: none;
      cursor: pointer;
    }

    .btn-drive-action {
      flex: 1;
      padding: 6px 4px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      background: var(--success-bg);
      color: var(--success);
    }

    /* Modal Pop-up Preview */
    .preview-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 10px;
    }

    .preview-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .preview-modal-box {
      background: var(--modal-bg);
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      transform: scale(0.95);
      transition: all 0.25s ease;
      border: 1px solid var(--border);
    }

    .preview-modal-overlay.active .preview-modal-box {
      transform: scale(1);
    }

    .preview-modal-header {
      padding: 12px 16px;
      background: var(--modal-header-bg);
      border-bottom: 1.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-modal-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 10px;
    }

    .btn-close-modal {
      background: var(--border);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: 800;
      cursor: pointer;
      color: var(--subtext);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-modal-body {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      background: #0f172a;
    }

    .preview-modal-body img {
      max-width: 100%;
      max-height: 55vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .preview-modal-body iframe {
      width: 100%;
      height: 55vh;
      border: none;
      border-radius: 8px;
      background: #ffffff;
    }

    .preview-doc-placeholder {
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }

    .preview-doc-placeholder .icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .preview-modal-footer {
      padding: 10px 14px;
      background: var(--modal-bg);
      border-top: 1.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-modal-open-drive {
      padding: 8px 14px;
      border-radius: 8px;
      background: #10b981;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
    }

    /* Log Aktivitas Styling */
    .log-container {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--border);
    }

    .log-header h3 {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
    }

    .btn-clear-log {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      background: var(--log-item-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .log-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-user {
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--text);
    }

    .log-time {
      font-size: 0.68rem;
      color: var(--subtext);
      font-weight: 600;
    }

    .log-filename {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 700;
    }

    .log-badge-success {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.62rem;
      font-weight: 800;
      background: var(--success-bg);
      color: var(--success);
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* Footer & Kontak Section */
    .footer-section {
      width: 100%;
      background: var(--footer-bg);
      border: 1.5px solid var(--footer-border);
      border-radius: 16px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: 0 4px 12px var(--shadow-color);
      margin-top: 10px;
    }

    .footer-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    .footer-desc {
      font-size: 0.78rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .social-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      transform: translateY(-2px);
    }

    .btn-wa { background: #14532d; color: #4ade80; border: 1px solid #16a34a; }
    .btn-email { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
    .btn-fb { background: #1e3a8a; color: #60a5fa; border: 1px solid #2563eb; }
    .btn-ig { background: #831843; color: #f472b6; border: 1px solid #db2777; }
    .btn-saweria { background: #78350f; color: #fbbf24; border: 1px solid #d97706; }
    .btn-trakteer { background: #7
