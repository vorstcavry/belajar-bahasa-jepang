<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Master Kanji &amp; Kosakata JLPT N5 - N4 (613 Kosakata)</title>

  <!-- Inisialisasi Tema Instan untuk Mencegah Efek Kedip (FOUC) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('theme_preference');
        if (savedTheme === 'light' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light-theme');
        } else {
          document.documentElement.classList.remove('light-theme');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

    /* ================= TEMA DEFAULT (DARK MODE) ================= */
    :root {
      --primary: #34d399;
      --primary-dark: #059669;
      --primary-light: #064e3b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --accent: #fbbf24;
      --gold: #fbbf24;
      --gold-bg: #451a03;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --toggle-btn-bg: #1e293b;
      --toggle-btn-border: #475569;
      --toggle-btn-text: #f8fafc;
      --app-header-bg: #1e293b;
      --view-tab-bg: #0f172a;
      --btn-cat-bg: #0f172a;
      --flip-front-bg: linear-gradient(145deg, #1e293b 0%, #064e3b 100%);
      --flip-front-border: #059669;
      --flip-back-bg: linear-gradient(145deg, #1e293b 0%, #451a03 100%);
      --flip-back-border: #b45309;
      --flip-reading-box-bg: rgba(15, 23, 42, 0.85);
      --flip-reading-box-border: #f59e0b;
      --flip-id-text: #fde68a;
      --flex-back-bg: #064e3b;
      --flex-back-border: #059669;
      --flex-hiragana-text: #86efac;
      --flex-meaning-bg: #052e16;
      --flex-meaning-text: #86efac;
      --mini-illus-bg: #064e3b;
      --mini-illus-border: #059669;
      --btn-audio-bg: #064e3b;
      --btn-audio-border: #059669;
      --btn-audio-text: #86efac;
      --footer-bg: #1e293b;
      --footer-border: #334155;
      --jp-font: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    /* ================= TEMA TERANG (LIGHT MODE) ================= */
    html.light-theme, body.light-theme {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #d1fae5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #cbd5e1;
      --accent: #f59e0b;
      --gold: #d97706;
      --gold-bg: #fef3c7;
      --shadow-color: rgba(100, 116, 139, 0.12);
      --toggle-btn-bg: #ffffff;
      --toggle-btn-border: #cbd5e1;
      --toggle-btn-text: #0f172a;
      --app-header-bg: #ffffff;
      --view-tab-bg: #e2e8f0;
      --btn-cat-bg: #f8fafc;
      --flip-front-bg: linear-gradient(145deg, #ffffff 0%, #f0fdf4 100%);
      --flip-front-border: #a7f3d0;
      --flip-back-bg: linear-gradient(145deg, #ffffff 0%, #fef3c7 100%);
      --flip-back-border: #fde68a;
      --flip-reading-box-bg: rgba(255, 255, 255, 0.85);
      --flip-reading-box-border: #f59e0b;
      --flip-id-text: #92400e;
      --flex-back-bg: #f0fdf4;
      --flex-back-border: #86efac;
      --flex-hiragana-text: var(--primary-dark);
      --flex-meaning-bg: #dcfce7;
      --flex-meaning-text: #14532d;
      --mini-illus-bg: #f0fdf4;
      --mini-illus-border: #bbf7d0;
      --btn-audio-bg: #d1fae5;
      --btn-audio-border: #6ee7b7;
      --btn-audio-text: var(--primary-dark);
      --footer-bg: #ffffff;
      --footer-border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
      min-height: 100vh;
    }

    /* Header Navigasi */
    .app-header {
      background: var(--app-header-bg);
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px var(--shadow-color);
    }

    .header-inner {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: var(--primary-dark);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .brand-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-back-hub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 2px 6px var(--shadow-color);
      transition: transform 0.2s ease;
    }

    .btn-back-hub:hover {
      transform: translateX(-2px);
    }

    .theme-toggle-btn {
      background: var(--toggle-btn-bg);
      border: 1.5px solid var(--toggle-btn-border);
      color: var(--toggle-btn-text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px var(--shadow-color);
      font-size: 1.1rem;
      user-select: none;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
    }

    .view-mode-tabs {
      display: flex;
      background: var(--view-tab-bg);
      padding: 3px;
      border-radius: 10px;
      gap: 3px;
      border: 1px solid var(--border);
    }

    .btn-view-mode {
      padding: 6px 12px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--subtext);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-view-mode.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 2px 4px var(--shadow-color);
    }

    .container {
      max-width: 1140px;
      margin: 16px auto;
      padding: 0 12px;
    }

    /* Kontrol Pencarian & Filter */
    .control-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .search-input-box {
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--subtext);
    }

    .category-scroll-group {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-scroll-group::-webkit-scrollbar {
      display: none;
    }

    .btn-cat {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--btn-cat-bg);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-cat.active {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
    }

    /* MODE 1: FLIP CARD TUNGGAL */
    .flashcard-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 520px;
      margin: 20px auto;
    }

    .flip-scene {
      width: 100%;
      height: 310px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px var(--shadow-color);
    }

    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      border: 2px solid var(--border);
      background: var(--card-bg);
    }

    .flip-face-front {
      background: var(--flip-front-bg);
      border-color: var(--flip-front-border);
    }

    .flip-face-back {
      background: var(--flip-back-bg);
      border-color: var(--flip-back-border);
      transform: rotateY(180deg);
    }

    .flip-header-meta {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tag-category-back {
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--btn-cat-bg);
      color: var(--subtext);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .flip-center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .flip-kanji-big {
      font-family: var(--jp-font);
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.35;
      margin: 4px 0;
      word-break: break-all;
    }

    .flip-kanji-big.long-word {
      font-size: 1.8rem;
    }

    .flip-reading-box {
      background: var(--flip-reading-box-bg);
      border: 1px dashed var(--flip-reading-box-border);
      border-radius: 12px;
      padding: 8px 16px;
      margin-bottom: 10px;
      width: 100%;
      max-width: 340px;
    }

    .flip-reading-text {
      font-family: var(--jp-font);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .flip-romaji-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      font-style: italic;
      margin-top: 2px;
    }

    .flip-id-text {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--flip-id-text);
      line-height: 1.35;
    }

    .flip-hint {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--subtext);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .flip-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
    }

    .btn-flash-nav {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-flash-nav:hover {
      background: var(--bg);
      border-color: var(--primary);
    }

    .btn-flash-audio {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-flash-audio:hover {
      background: var(--primary);
    }

    .card-counter {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--subtext);
    }

    /* MODE 2: DAFTAR GRID KAMUS */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .vocab-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 2px 6px var(--shadow-color);
    }

    .vocab-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(5, 150, 105, 0.15);
    }

    .vocab-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .vocab-mini-illus {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--mini-illus-bg);
      border: 1px solid var(--mini-illus-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .vocab-text-group {
      flex: 1;
    }

    .vocab-jp {
      font-family: var(--jp-font);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .vocab-reading-mini {
      font-family: var(--jp-font);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 1px;
    }

    .vocab-id {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--subtext);
      line-height: 1.35;
      margin-top: 3px;
    }

    .vocab-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      margin-top: 4px;
    }

    .btn-audio-mini {
      background: var(--btn-audio-bg);
      border: 1px solid var(--btn-audio-border);
      color: var(--btn-audio-text);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .tag-category-badge {
      font-size: 0.7rem;
      font-weight: 800;
      background: var(--btn-cat-bg);
      color: var(--subtext);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* MODE 3: GRID FLEKSIBEL */
    .flex-header-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .flex-total-count {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--subtext);
    }

    .btn-flex-shuffle {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-flex-shuffle:hover {
      border-color: var(--primary);
      background: var(--bg);
      color: var(--primary);
    }

    .flex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .flex-card {
      perspective: 1000px;
      height: 195px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .flex-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 3px 10px var(--shadow-color);
    }

    .flex-card.flipped .flex-card-inner {
      transform: rotateY(180deg);
    }

    .flex-card-front, .flex-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 8px;
      border: 1.5px solid var(--border);
    }

    .flex-card-front {
      background-color: var(--card-bg);
      transition: all 0.2s ease;
    }

    .flex-card-front:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(5, 150, 105, 0.15);
    }

    .flex-card-back {
      background-color: var(--flex-back-bg);
      transform: rotateY(180deg);
      border-color: var(--flex-back-border);
    }

    .flex-kanji-char {
      font-family: var(--jp-font);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
      letter-spacing: 1px;
      word-break: break-all;
      margin-top: 8px;
    }

    .flex-kanji-char.long-word {
      font-size: 1.5rem;
    }

    .flex-hint-tap {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--subtext);
      margin-top: 10px;
      background: var(--bg);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .flex-visual-icon {
      font-size: 1.8rem;
      margin-bottom: 2px;
      line-height: 1;
    }

    .flex-hiragana {
      font-family: var(--jp-font);
      font-size: 0.95rem;
      color: var(--flex-hiragana-text);
      font-weight: 800;
      margin-bottom: 2px;
      line-height: 1.2;
    }

    .flex-romaji {
      font-size: 0.75rem;
      color: var(--accent);
      font-style: italic;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .flex-meaning {
      font-size: 0.78rem;
      color: var(--flex-meaning-text);
      font-weight: 700;
      background: var(--flex-meaning-bg);
      padding: 3px 8px;
      border-radius: 6px;
      max-width: 95%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.2;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--subtext);
      grid-column: 1 / -1;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1.5px dashed var(--border);
    }

    @media (max-width: 480px) {
      .flex-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .flex-card {
        height: 185px;
      }
      .flex-kanji-char {
        font-size: 1.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-title">
        <span class="brand-badge">KANJI &amp; KOTOBA</span>
        <span class="brand-text">613 Kosakata JLPT N5 - N4</span>
      </div>

      <div class="header-actions">
        <a href="/belajar-bahasa-jepang/menu/kanji/kanji.html" class="btn-back-hub">
          <span>←</span> Kembali
        </a>

        <!-- Tab Pilihan Mode Belajar (3 Mode) -->
        <div class="view-mode-tabs">
          <button class="btn-view-mode active" id="btnModeFlip" onclick="switchViewMode('flip')">🎴 Flashcard</button>
          <button class="btn-view-mode" id="btnModeFlex" onclick="switchViewMode('flex')">⚡ Fleksibel</button>
          <button class="btn-view-mode" id="btnModeList" onclick="switchViewMode('list')">📑 Kamus</button>
        </div>

        <button class="theme-toggle-btn" id="themeToggleBtn" type="button" title="Ubah Tema">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Kontrol Filter Kategori & Pencarian -->
    <div class="control-card">
      <div class="search-input-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Cari kanji, hiragana, romaji, atau arti..." oninput="handleSearch()">
      </div>

    // --- 1. SINKRONISASI TEMA OTOMATIS & INTEGRATIF ---
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const rootHtml = document.documentElement;
    const bodyEl = document.body;

    function applyThemeState(isLight) {
      if (isLight) {
        rootHtml.classList.add('light-theme');
        if (bodyEl) bodyEl.classList.add('light-theme');
        if (themeIcon) themeIcon.textContent = '☀️';
        try { localStorage.setItem('theme_preference', 'light'); } catch (e) {}
      } else {
        rootHtml.classList.remove('light-theme');
        if (bodyEl) bodyEl.classList.remove('light-theme');
        if (themeIcon) themeIcon.textContent = '🌙';
        try { localStorage.setItem('theme_preference', 'dark'); } catch (e) {}
      }
    }

    function initTheme() {
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('theme_preference'); } catch (e) {}

      if (savedTheme === 'light' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        applyThemeState(true);
      } else {
        applyThemeState(false);
      }
    }

    // Jalankan inisialisasi tema
    initTheme();

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isCurrentlyLight = rootHtml.classList.contains('light-theme') || (bodyEl && bodyEl.classList.contains('light-theme'));
        applyThemeState(!isCurrentlyLight);
      });
    }

    // Sinkronisasi otomatis saat tema diubah dari tab lain
    window.addEventListener('storage', (event) => {
      if (event.key === 'theme_preference') {
        applyThemeState(event.newValue === 'light');
      }
    });

    // Engine Konversi Hiragana ke Romaji
    function toRomaji(str) {
      if (!str) return '';
      const map = {
        'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho',
        'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
        'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
        'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
        'じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo',
        'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo','あ':'a','い':'i','う':'u','え':'e','お':'o',
        'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
        'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
        'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
        'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
        'わ':'wa','を':'o','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
        'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ヂ':'ji','づ':'zu','で':'de','ど':'do',
        'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ポ':'po',
        'ア':'a','イ':'i','ウ':'u','エ':'e','オ':'o','カ':'ka','キ':'ki','ク':'ku','ケ':'ke','コ':'ko',
        'サ':'sa','シ':'shi','ス':'su','セ':'se','ソ':'so','タ':'ta','チ':'chi','ツ':'tsu','テ':'te','ト':'to',
        'ナ':'na','ニ':'ni','ヌ':'nu','ネ':'ne','ノ':'no','ハ':'ha','ヒ':'hi','フ':'fu','ヘ':'he','ホ':'ho',
        'マ':'ma','ミ':'mi','ム':'mu','メ':'me','モ':'mo','ヤ':'ya','ユ':'yu','ヨ':'yo','ラ':'ra','リ':'ri',
        'ル':'ru','レ':'re','ロ':'ro','ワ':'wa','ヲ':'o','ン':'n','ガ':'ga','ギ':'gi','グ':'gu','ゲ':'ge','ゴ':'go',
        'ザ':'za','ジ':'ji','ズ':'zu','ゼ':'ze','ゾ':'zo','ダ':'da','ヂ':'ji','ヅ':'zu','デ':'de','ド':'do',
        'バ':'ba','ビ':'bi','ブ':'bu','ベ':'be','ボ':'bo','パ':'pa','ピ':'pi','プ':'pu','ペ':'pe','ポ':'po',
        'キャ':'kya','キュ':'kyu','キョ':'kyo','シャ':'sha','シュ':'shu','ショ':'sho',
        'チャ':'cha','チュ':'chu','チョ':'cho','ニャ':'nya','ニュ':'nyu','ニョ':'nyo',
        'ヒャ':'hya','ヒュ':'hyu','ヒョ':'hyo','ミャ':'mya','ミュ':'myu','ミョ':'myo',
        'リャ':'rya','リュ':'ryu','リョ':'ryo','ギャ':'gya','ギュ':'gyu','ギョ':'gyo',
        'ジャ':'ja','ジュ':'ju','ジョ':'jo','ビャ':'bya','ビュ':'byu','ビョ':'byo',
        'ピャ':'pya','ピュ':'pyu','ピョ':'pyo','ー':'-'
      };
      let res = '';
      let i = 0;
      while (i < str.length) {
        if (str[i] === 'っ' || str[i] === 'ッ') {
          let nextTwo = str.substring(i+1, i+3);
          let nextOne = str.substring(i+1, i+2);
          let nxt = map[nextTwo] || map[nextOne] || '';
          if (nxt) {
            res += (nxt[0] === 'c' ? 't' : nxt[0]);
          }
          i++;
          continue;
        }
        let two = str.substring(i, i+2);
        if (map[two]) {
          res += map[two];
          i += 2;
        } else if (map[str[i]]) {
          res += map[str[i]];
          i++;
        } else {
          res += str[i];
          i++;
        }
      }
      return res;
    }

    let currentCategory = 'all';
    let filteredList = [...masterKanjiList];
    let currentFlashIndex = 0;
    let currentViewMode = 'flip';

    function initApp() {
      applyFilter();
    }

    function setCategoryFilter(catKey, btn) {
      currentCategory = catKey;
      document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter();
    }

    function handleSearch() {
      applyFilter();
    }

    function switchViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btnModeFlip').classList.toggle('active', mode === 'flip');
      document.getElementById('btnModeFlex').classList.toggle('active', mode === 'flex');
      document.getElementById('btnModeList').classList.toggle('active', mode === 'list');

      document.getElementById('flipModeView').style.display = (mode === 'flip') ? 'flex' : 'none';
      document.getElementById('flexModeSection').style.display = (mode === 'flex') ? 'block' : 'none';
      document.getElementById('listModeView').style.display = (mode === 'list') ? 'grid' : 'none';
    }

    function applyFilter() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      filteredList = masterKanjiList.filter(item => {
        const romaji = toRomaji(item.rd).toLowerCase();
        const matchCategory = (currentCategory === 'all') || (item.cat === currentCategory);
        const matchQuery = !query || 
                           item.kj.toLowerCase().includes(query) || 
                           item.rd.toLowerCase().includes(query) || 
                           romaji.includes(query) || 
                           item.id.toLowerCase().includes(query) || 
                           item.no.toString() === query;
        return matchCategory && matchQuery;
      });

      currentFlashIndex = 0;
      updateFlashcardDisplay();
      renderFlexView();
      renderListView();
    }

    // --- LOGIKA FLIP CARD ---
    function toggleCardFlip() {
      const card = document.getElementById('flipCardInner');
      card.classList.toggle('is-flipped');
    }

    function updateFlashcardDisplay() {
      const card = document.getElementById('flipCardInner');
      card.classList.remove('is-flipped');

      if (filteredList.length === 0) {
        document.getElementById('flipFrontKanji').innerText = "無";
        document.getElementById('flipBackReading').innerText = "-";
        document.getElementById('flipBackRomaji').innerText = "";
        document.getElementById('flipBackId').innerText = "Kosakata tidak ditemukan";
        document.getElementById('flipBackCat').innerText = "-";
        document.getElementById('flipCounterText').innerText = "0 dari 0 Kartu";
        return;
      }

      const item = filteredList[currentFlashIndex];
      const romajiText = toRomaji(item.rd);

      // Sisi Depan
      const frontEl = document.getElementById('flipFrontKanji');
      frontEl.innerText = item.kj;
      frontEl.className = item.kj.length >= 4 ? 'flip-kanji-big long-word' : 'flip-kanji-big';

      // Sisi Belakang
      document.getElementById('flipBackReading').innerText = item.rd;
      document.getElementById('flipBackRomaji').innerText = romajiText;
      document.getElementById('flipBackId').innerText = item.id;
      document.getElementById('flipBackCat').innerText = item.tag;

      document.getElementById('flipCounterText').innerText = `Kartu ${currentFlashIndex + 1} dari ${filteredList.length}`;
    }

    function navigateFlashcard(step) {
      if (filteredList.length === 0) return;
      currentFlashIndex += step;
      if (currentFlashIndex < 0) currentFlashIndex = filteredList.length - 1;
      if (currentFlashIndex >= filteredList.length) currentFlashIndex = 0;
      updateFlashcardDisplay();
    }

    function shuffleCurrentList() {
      if (filteredList.length <= 1) return;
      for (let i = filteredList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
      }
      currentFlashIndex = 0;
      updateFlashcardDisplay();
      renderFlexView();
      renderListView();
    }

    function playCurrentFlashVoice() {
      if (filteredList.length === 0) return;
      playAudioVoice(filteredList[currentFlashIndex].kj);
    }

    // --- LOGIKA MODE FLEKSIBEL ---
    function renderFlexView() {
      const container = document.getElementById('flexModeView');
      const countEl = document.getElementById('flexTotalText');
      container.innerHTML = '';
      countEl.innerText = `Menampilkan ${filteredList.length} Kanji`;

      if (filteredList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2rem; margin-bottom: 8px;">🔍</div>
            <p style="font-weight: 700;">Kosakata kanji tidak ditemukan</p>
          </div>
        `;
        return;
      }

      filteredList.forEach(item => {
        const romajiText = toRomaji(item.rd);
        const card = document.createElement('div');
        card.className = 'flex-card';
        card.onclick = () => card.classList.toggle('flipped');

        card.innerHTML = `
          <div class="flex-card-inner">
            <div class="flex-card-front">
              <div class="flex-kanji-char ${item.kj.length >= 4 ? 'long-word' : ''}">${item.kj}</div>
              <div class="flex-hint-tap">Ketuk balik 🔄</div>
            </div>
            <div class="flex-card-back">
              <div class="flex-visual-icon">${item.icon || '📖'}</div>
              <div class="flex-hiragana">${item.rd}</div>
              <div class="flex-romaji">${romajiText}</div>
              <div class="flex-meaning">${item.id}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- LOGIKA DAFTAR GRID KAMUS ---
    function renderListView() {
      const container = document.getElementById('listModeView');
      container.innerHTML = '';

      if (filteredList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2rem; margin-bottom: 8px;">🔍</div>
            <p style="font-weight: 700;">Kosakata kanji tidak ditemukan</p>
          </div>
        `;
        return;
      }

      filteredList.forEach(item => {
        const romajiText = toRomaji(item.rd);
        const card = document.createElement('div');
        card.className = 'vocab-card';
        card.innerHTML = `
          <div class="vocab-top">
            <div class="vocab-mini-illus">${item.icon || '📖'}</div>
            <div class="vocab-text-group">
              <div class="vocab-jp">${item.kj}</div>
              <div class="vocab-reading-mini">${item.rd} &bull; <i>${romajiText}</i></div>
              <div class="vocab-id">${item.id}</div>
            </div>
          </div>
          <div class="vocab-bottom">
            <span class="tag-category-badge">${item.tag}</span>
            <button class="btn-audio-mini" onclick="playAudioVoice('${item.kj.replace(/'/g, "\\'")}')">🔊 Dengar</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function playAudioVoice(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[～~]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
